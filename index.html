<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#071d36">
<title>Paramount Mock Test</title>
<style>
:root{--navy:#071d36;--blue:#0b4f86;--gold:#f2c300;--light:#f5f8fb;--line:#d7e0e8;--danger:#c62828;--green:#147d4a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:#152536}
button,input{font:inherit}button{cursor:pointer}
.topbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:6px}.brand h1{font-size:20px;margin:0}.brand small{color:#f7d33b}
.timer{font-size:22px;font-weight:800;background:#102f50;padding:9px 14px;border-radius:8px}
.container{max-width:1180px;margin:24px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 5px 18px #071d3612}
.center{text-align:center}.logoLarge{width:130px;max-width:45vw}.gold{color:#c99d00}.btn{border:0;border-radius:7px;padding:11px 18px;font-weight:700;background:var(--blue);color:#fff}.btn.goldBtn{background:var(--gold);color:#152536}.btn.secondary{background:#eef3f7;color:#152536;border:1px solid #ccd8e2}.btn.danger{background:var(--danger)}.btn.green{background:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700}.field input{padding:12px;border:1px solid #bfcbd6;border-radius:7px}
.instructions li{margin:9px 0}.sectionTitle{background:var(--navy);color:#fff;padding:10px 14px;border-radius:7px;margin:18px 0 12px}
.examGrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}.questionCard{min-height:500px;display:flex;flex-direction:column}.qtop{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}.qnum{font-weight:800;color:var(--blue)}.question{font-size:19px;line-height:1.55;margin:22px 0}.option{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid #d2dce5;border-radius:8px;margin:10px 0;background:#fff}.option:hover{background:#f5f9fc}.option input{margin-top:4px;accent-color:var(--blue)}
.navpanel{position:sticky;top:88px;height:max-content}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.num{padding:8px 0;border:1px solid #ccd7e1;border-radius:6px;background:#fff;font-weight:700}.num.current{outline:2px solid var(--blue)}.num.answered{background:#d9f2e7;border-color:#78b99b}.num.review{background:#fff2c7;border-color:#e0b73b}.num.answered.review{background:#e9d8ff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}.actions .spacer{flex:1}
.warning{background:#fff4e5;border:1px solid #f0bd64;padding:12px;border-radius:8px}.dangerBox{background:#ffebee;border:1px solid #ef9a9a;padding:12px;border-radius:8px}
.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7fafc;border:1px solid var(--line);padding:14px;border-radius:8px}.stat b{display:block;font-size:24px;color:var(--blue);margin-top:4px}
.bar{height:22px;background:#e8edf2;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}
.radar{width:100%;max-width:420px;height:330px}
.tableWrap{overflow:auto}.adminTable{border-collapse:collapse;width:100%;font-size:13px}.adminTable th,.adminTable td{border:1px solid #ccd7e1;padding:8px;text-align:left}.adminTable th{background:var(--navy);color:#fff}
.hidden{display:none!important}.muted{color:#617182}.small{font-size:13px}.footer{text-align:center;color:#657586;padding:25px}
@media(max-width:850px){.examGrid{grid-template-columns:1fr}.navpanel{position:static}.statGrid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.topbar{position:static}.question{font-size:17px}}
@media(max-width:520px){.statGrid{grid-template-columns:1fr}.brand h1{font-size:16px}.brand img{width:46px;height:46px}.timer{font-size:17px}.card{padding:16px}.actions button{flex:1 1 45%}}
@media print{body{background:#fff}.topbar,.actions,.navpanel,.noPrint{display:none!important}.container{max-width:none;margin:0}.card{box-shadow:none;border:0}.printOnly{display:block!important}}
.printOnly{display:none}
</style>
</head>

let state={page:"register",student:null,index:0,answers:Array(200).fill(null),review:Array(200).fill(false),
start:0,tabSwitches:0,copyAttempts:0,rightClickAttempts:0,consoleAttempts:0,fullscreenExits:0,
autoSubmitted:false,warningCount:0,timeLimit:180*60};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function save(){localStorage.setItem("paramount_state",JSON.stringify(state))}
function load(){try{let x=JSON.parse(localStorage.getItem("paramount_state"));if(x&&x.student&&x.page==="exam"){state=x;render()}}catch(e){}}
function shell(body){document.getElementById("app").innerHTML=body}
function header(showTimer=false){
 return `<div class="topbar"><div class="brand"><img src="${LOGO}"><div><h1>Paramount Mock Test</h1><small>Merchant Navy Entrance Practice</small></div></div>${showTimer?`<div class="timer" id="timer">180:00</div>`:""}</div>`;
}
function render(){ if(state.page==="register")regPage(); else if(state.page==="instructions")instructionPage(); else if(state.page==="exam")examPage(); else if(state.page==="result")resultPage(); else if(state.page==="admin")adminPage(); }
function regPage(){shell(header()+`<div class="container"><div class="card center"><img class="logoLarge" src="${LOGO}"><h1>Paramount Mock Test</h1><p class="muted">IMUCET Full-Length Online Mock Examination</p>
<div class="grid2" style="text-align:left;max-width:720px;margin:25px auto"><div class="field"><label>Student Name *</label><input id="name" placeholder="Enter full name"></div><div class="field"><label>Mobile Number *</label><input id="phone" inputmode="numeric" placeholder="10-digit mobile number"></div><div class="field"><label>Email Address *</label><input id="email" type="email" placeholder="Enter email"></div></div>
<button class="btn goldBtn" onclick="startRegistration()">Continue to Instructions</button>
<div style="margin-top:20px"><button class="btn secondary small" onclick="adminLogin()">Admin Login</button></div></div><div class="footer">Paramount Online Test Platform</div></div>`)}
function startRegistration(){let n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.trim(),e=document.getElementById("email").value.trim();if(!n||!/^[0-9]{10}$/.test(p)||!e||!e.includes("@"))return alert("Please enter a valid name, 10-digit mobile number and email.");state.student={name:n,phone:p,email:e};state.page="instructions";save();render()}
function instructionPage(){shell(header()+`<div class="container"><div class="card"><h2>Exam Instructions</h2><div class="instructions"><ul>
<li><b>Total Questions:</b> 200</li><li><b>Sections:</b> Physics 70, Chemistry 60, Mathematics 70</li><li><b>Duration:</b> 180 minutes (3 hours)</li><li><b>Marking:</b> +1 correct, −0.25 incorrect, 0 unattempted.</li><li><b>Anti-cheating:</b> Tab switching is monitored. The first 3 switches generate warnings; the 4th switch automatically submits the test.</li><li><b>Admin WhatsApp:</b> 8116217554 — use Share with Admin on the result page.</li><li><b>Leaderboard:</b> Intended to be released on the next day.</li><li><b>One question per page:</b> use Previous, Clear, Next, Mark for Review and Submit.</li>
</ul></div><div class="warning"><b>Important:</b> Start the test only when you are ready. The 180-minute timer starts when Question 1 appears.</div>
<div class="center" style="margin-top:22px"><button class="btn goldBtn" onclick="beginExam()">I Understand — Start Exam</button></div></div></div>`)}
function beginExam(){state.page="exam";state.index=0;state.start=Date.now();state.timeLimit=180*60;save();render();enterFullscreen()}
function enterFullscreen(){document.documentElement.requestFullscreen?.().catch(()=>{})}
function examPage(){let q=questions[state.index],answered=state.answers.filter(x=>x!==null).length;
shell(header(true)+`<div class="container"><div class="examGrid"><div class="card questionCard"><div class="qtop"><span class="qnum">${q[0]} · Question ${state.index+1} of 200</span><span class="small">${answered}/200 Attempted</span></div><div class="question">${esc(q[1])}</div><div>${q[2].map((o,i)=>`<label class="option"><input type="radio" name="opt" value="${i}" ${state.answers[state.index]===i?"checked":""} onchange="choose(${i})"><span><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</span></label>`).join("")}</div><div class="actions"><button class="btn secondary" onclick="prevQ()">Previous</button><button class="btn secondary" onclick="clearQ()">Clear Options</button><button class="btn secondary" onclick="reviewQ()">${state.review[state.index]?"Unmark Review":"Mark as Review"}</button><span class="spacer"></span>${state.index===199?`<button class="btn danger" onclick="submitExam(false)">Submit Test</button>`:`<button class="btn" onclick="nextQ()">Next</button>`}</div></div>
<div class="card navpanel"><h3>Question Navigation</h3><div class="small muted">Green = answered · Yellow = review</div><div class="numbers">${state.answers.map((a,i)=>`<button class="num ${i===state.index?"current ":""}${a!==null?"answered ":""}${state.review[i]?"review":""}" onclick="gotoQ(${i})">${i+1}</button>`).join("")}</div></div></div></div>`);
startTimer()}
function choose(i){state.answers[state.index]=i;save();examPage()}
function clearQ(){state.answers[state.index]=null;save();examPage()}
function reviewQ(){state.review[state.index]=!state.review[state.index];save();examPage()}
function nextQ(){if(state.index<199){state.index++;save();render()}}
function prevQ(){if(state.index>0){state.index--;save();render()}}
function gotoQ(i){state.index=i;save();render()}
let timerInt=null;
function startTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{if(state.page!=="exam"){clearInterval(timerInt);return}let elapsed=Math.floor((Date.now()-state.start)/1000),left=Math.max(0,state.timeLimit-elapsed),m=Math.floor(left/60),s=left%60;let el=document.getElementById("timer");if(el)el.textContent=String(m).padStart(3,"0")+":"+String(s).padStart(2,"0");if(left<=0){clearInterval(timerInt);submitExam(true)}},1000)}
function submitExam(auto){if(state.page!=="exam")return;if(!auto&&!confirm("Submit your test now?"))return;state.autoSubmitted=auto;state.page="result";clearInterval(timerInt);document.exitFullscreen?.().catch(()=>{});save();render()}
function calc(){let c=0,w=0,u=0;state.answers.forEach((a,i)=>a===null?u++:a===questions[i][3]?c++:w++);let marks=c-w*.25;let elapsed=Math.min(state.timeLimit,Math.floor((Date.now()-state.start)/1000));return {c,w,u,marks,pct:marks/2,time:elapsed}}
function fmt(sec){return Math.floor(sec/60)+"m "+(sec%60)+"s"}
function resultPage(){let r=calc(),status=state.tabSwitches>3?"Disqualified":(state.tabSwitches>0?"Warnings issued":"Clean");storeResult(r,status);
shell(header()+`<div class="container"><div class="card"><div class="center"><img class="logoLarge" src="${LOGO}"><h1>Test Performance</h1><p><b>${esc(state.student.name)}</b> · ${esc(state.student.phone)}</p></div>
<div class="${state.autoSubmitted?"dangerBox":"warning"}">${state.autoSubmitted?"Test was automatically submitted because the time expired or anti-cheating threshold was exceeded.":"Test submitted successfully."}</div>
<div class="statGrid" style="margin-top:18px"><div class="stat">Marks<b>${r.marks.toFixed(2)}/200</b></div><div class="stat">Percentage<b>${r.pct.toFixed(2)}%</b></div><div class="stat">Attempted<b>${r.c+r.w}</b></div><div class="stat">Time<b>${fmt(r.time)}</b></div></div>
<div class="sectionTitle">Answer Summary</div><p>✅ Correct: <b>${r.c}</b> &nbsp; ❌ Incorrect: <b>${r.w}</b> &nbsp; ⊘ Unattempted: <b>${r.u}</b></p>
<div class="sectionTitle">Performance</div><div class="bar"><span style="width:${Math.max(0,Math.min(100,r.pct))}%"></span></div><p class="small muted">Score percentage based on maximum 200 marks.</p>

function reviewHTML(){return questions.map((q,i)=>{let a=state.answers[i],ok=a===q[3];return `<div style="border-bottom:1px solid #ddd;padding:8px 0"><b>${i+1}. ${esc(q[1])}</b><br>Your answer: ${a===null?"Unattempted":String.fromCharCode(65+a)+". "+esc(q[2][a])}<br>Correct answer: ${String.fromCharCode(65+q[3])}. ${esc(q[2][q[3]])} — ${a===null?"Unattempted":ok?"Correct":"Incorrect"}</div>`}).join("")}
function drawRadar(r){let c=document.getElementById("radar");if(!c)return;let x=c.getContext("2d"),cx=210,cy=160,R=120,vals=["Physics","Chemistry","Math"],counts=[0,0,0];questions.forEach((q,i)=>{if(state.answers[i]===q[3])counts[q[0]==="Physics"?0:q[0]==="Chemistry"?1:2]++});let max=[70,60,70],pts=vals.map((_,i)=>{let a=-Math.PI/2+i*2*Math.PI/3;return [cx+R*Math.cos(a),cy+R*Math.sin(a)]});x.clearRect(0,0,420,330);x.strokeStyle="#9aa9b7";for(let k=1;k<=5;k++){x.beginPath();for(let i=0;i<3;i++){let a=-Math.PI/2+i*2*Math.PI/3,rr=R*k/5;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}x.closePath();x.stroke()}x.beginPath();pts.forEach(p=>x.lineTo(p[0],p[1]));x.closePath();x.stroke();x.beginPath();counts.forEach((v,i)=>{let a=-Math.PI/2+i*2*Math.PI/3,rr=R*v/max[i];x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))});x.closePath();x.fillStyle="rgba(11,79,134,.22)";x.fill();x.strokeStyle="#0b4f86";x.stroke();pts.forEach((p,i)=>{x.fillStyle="#152536";x.fillText(vals[i]+" "+counts[i]+"/"+max[i],p[0]-35,p[1]+(i===0?-10:20))})}
function shareWhatsApp(){let r=calc(),status=state.tabSwitches>3?"Disqualified":state.tabSwitches>0?"Warnings issued":"Clean";let date=new Date().toLocaleDateString("en-IN");let text=`🎓 *Paramount - Mock Test Results*\\n\\n👤 *Student Details:*\\nName: ${state.student.name}\\nPhone: ${state.student.phone}\\nE mail address: ${state.student.email}\\n\\n📊 *Test Performance:*\\nTotal Marks: ${r.marks.toFixed(2)}/200\\nPercentage: ${r.pct.toFixed(2)}%\\nPass/Fail: ${r.marks>=70?"Pass":"Fail"}\\nTime Taken: ${fmt(r.time)}\\nDate: ${date}\\n\\n✅ Correct Answers: ${r.c}\\n❌ Incorrect Answers: ${r.w}\\n⊘ Unattempted: ${r.u}\\n📝 Attempted: ${r.c+r.w}\\n\\n⚠️ *Anti-Cheating Report:*\\nTab Switches: ${state.tabSwitches}\\nCopy Attempts: ${state.copyAttempts}\\nRight-Click Attempts: ${state.rightClickAttempts}\\nConsole Access Attempts: ${state.consoleAttempts}\\nFullscreen Exit Count: ${state.fullscreenExits}\\nStatus: ${status}\\n\\nGenerated on Paramount Online Test Platform`;window.location.href="https://wa.me/918116217554?text="+encodeURIComponent(text)}
function downloadPerformance(){let html=`<html><head><title>Paramount Performance</title><style>body{font-family:Arial;padding:25px}h1{color:#071d36}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:6px;text-align:left}</style></head><body><h1>Paramount Mock Test — Performance & Answer Key</h1><p>Name: ${esc(state.student.name)}<br>Phone: ${esc(state.student.phone)}<br>Email: ${esc(state.student.email)}</p>${reviewHTML()}<script>window.onload=()=>setTimeout(()=>window.print(),500)<\/script></body></html>`;let w=window.open("","_blank");w.document.write(html);w.document.close()}
function storeResult(r,status){let key="paramount_results",arr=JSON.parse(localStorage.getItem(key)||"[]"),id=state.student.phone+"_"+new Date().toISOString();if(!arr.some(x=>x.id===id)){arr.push({id,name:state.student.name,phone:state.student.phone,email:state.student.email,marks:r.marks,percentage:r.pct,time:r.time,correct:r.c,incorrect:r.w,unattempted:r.u,attempted:r.c+r.w,tabSwitches:state.tabSwitches,copyAttempts:state.copyAttempts,rightClickAttempts:state.rightClickAttempts,consoleAttempts:state.consoleAttempts,fullscreenExits:state.fullscreenExits,status,date:new Date().toISOString(),answers:state.answers});localStorage.setItem(key,JSON.stringify(arr))}}
function adminLogin(){let u=prompt("Admin ID");if(u===null)return;let p=prompt("Admin Password");if(u==="PARAMOUNT_ADMIN"&&p==="PMT@20026"){state.page="admin";render()}else alert("Invalid admin credentials. Change these credentials in the source before publishing.");}
function adminPage(){let arr=JSON.parse(localStorage.getItem("paramount_results")||"[]");shell(header()+`<div class="container"><div class="card"><h2>Admin Dashboard</h2><p class="muted">Local browser database. This is not a server-side secure database.</p><div class="actions"><button class="btn green" onclick="downloadCSV()">Download CSV</button><button class="btn danger" onclick="if(confirm('Delete all local records?')){localStorage.removeItem('paramount_results');adminPage()}">Delete Records</button><button class="btn secondary" onclick="location.reload()">Exit</button></div><div class="tableWrap" style="margin-top:18px"><table class="adminTable"><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Marks</th><th>%</th><th>Attempted</th><th>Cheating</th></tr>${arr.map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${Number(x.marks).toFixed(2)}</td><td>${Number(x.percentage).toFixed(2)}</td><td>${x.attempted}</td><td>${esc(x.status)}</td></tr>`).join("")}</table></div></div></div>`)}
function downloadCSV(){let a=JSON.parse(localStorage.getItem("paramount_results")||"[]"),cols=["date","name","phone","email","marks","percentage","time","correct","incorrect","unattempted","attempted","tabSwitches","copyAttempts","rightClickAttempts","consoleAttempts","fullscreenExits","status"];let csv=[cols.join(","),...a.map(x=>cols.map(k=>`"${String(x[k]??"").replaceAll('"','""')}"`).join(","))].join("\\n");let blob=new Blob([csv],{type:"text/csv"}),u=URL.createObjectURL(blob),ael=document.createElement("a");ael.href=u;ael.download="paramount-results.csv";ael.click();URL.revokeObjectURL(u)}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.page==="exam"){state.tabSwitches++;state.warningCount++;save();if(state.tabSwitches<=3)alert(`Warning ${state.tabSwitches}/3: Tab switching detected. One more switch after three warnings will submit the test.`);else submitExam(true)}});
document.addEventListener("copy",()=>{if(state.page==="exam"){state.copyAttempts++;save()}});
document.addEventListener("contextmenu",e=>{if(state.page==="exam"){e.preventDefault();state.rightClickAttempts++;save()}});
document.addEventListener("fullscreenchange",()=>{if(state.page==="exam"&&!document.fullscreenElement){state.fullscreenExits++;save()}});
window.addEventListener("beforeunload",save);
render();
